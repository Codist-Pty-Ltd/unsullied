<div class="mx-auto max-w-md py-10">
  <div class="rounded-2xl border border-gray-100 bg-white p-6 shadow-sm sm:p-8">
    <h1 class="text-2xl font-semibold text-[#13294e]">Admin sign in</h1>
    <p class="mt-1 text-sm text-gray-500">Quotes and the booking calendar are for Unsullied staff.</p>

    <form class="mt-6 space-y-4" (ngSubmit)="submit()">
      <div>
        <label for="admin-email" class="mb-1.5 block text-sm font-medium text-gray-700">Email</label>
        <input
          id="admin-email"
          type="email"
          name="email"
          autocomplete="username"
          [(ngModel)]="email"
          class="w-full rounded-lg border border-gray-200 px-3 py-2.5 text-sm text-gray-900 outline-none focus:border-[#181d95]"
          required
        />
      </div>
      <div>
        <label for="admin-password" class="mb-1.5 block text-sm font-medium text-gray-700">Password</label>
        <input
          id="admin-password"
          type="password"
          name="password"
          autocomplete="current-password"
          [(ngModel)]="password"
          class="w-full rounded-lg border border-gray-200 px-3 py-2.5 text-sm text-gray-900 outline-none focus:border-[#181d95]"
          required
        />
      </div>

      <p *ngIf="error" class="rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700">{{ error }}</p>

      <button
        type="submit"
        [disabled]="isSubmitting"
        class="w-full rounded-lg bg-[#181d95] px-4 py-2.5 text-sm font-semibold text-white disabled:opacity-60"
      >
        {{ isSubmitting ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>
  </div>
</div>
